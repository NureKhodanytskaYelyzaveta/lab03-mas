[project]
name = "horror-team"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = ["google-adk>=2.0"]

[project.optional-dependencies]
# крок 13: база знань із ЛР 2 (Obsidian + Chroma)
kb = ["chromadb>=1.5", "python-frontmatter>=1.0", "python-dotenv>=1.2.4"]

[dependency-groups]
dev = ["pytest>=8", "chromadb>=1.5", "python-frontmatter>=1.0", "python-dotenv>=1.2.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
